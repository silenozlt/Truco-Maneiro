<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<p>Open browser console. Icons download automatically.</p>
<script>
const sizes = [72, 96, 128, 144, 152, 180, 192, 384, 512];

function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#0a2e1a';
  ctx.beginPath();
  ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
  ctx.fill();

  // Inner circle
  ctx.fillStyle = '#1a5c35';
  ctx.beginPath();
  ctx.arc(size/2, size/2, size*0.42, 0, Math.PI*2);
  ctx.fill();

  // Card suits
  const s = size * 0.15;
  ctx.font = `bold ${s}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#ef4444';
  ctx.fillText('\u2665', size*0.32, size*0.35);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillText('\u2660', size*0.68, size*0.35);
  ctx.fillStyle = '#ef4444';
  ctx.fillText('\u2666', size*0.32, size*0.65);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillText('\u2663', size*0.68, size*0.65);

  // "T" letter
  const ts = size * 0.22;
  ctx.font = `900 ${ts}px Arial`;
  ctx.fillStyle = '#fbbf24';
  ctx.strokeStyle = '#92400e';
  ctx.lineWidth = size * 0.01;
  ctx.strokeText('T', size/2, size/2);
  ctx.fillText('T', size/2, size/2);

  return canvas;
}

sizes.forEach(size => {
  const canvas = drawIcon(size);
  const link = document.createElement('a');
  const name = size === 180 ? 'apple-touch-icon.png' : `icon-${size}x${size}.png`;
  link.download = name;
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>
</body>
</html>
